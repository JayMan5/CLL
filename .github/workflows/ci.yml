name: CourtLOG CI

on:
  push:
    branches:
      - main
      - arena/01a0f82f-cll
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q backend tests scripts

      - name: Run backend tests
        run: python -m pytest -q

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt

  frontend:
    name: Frontend tests and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run frontend regression tests
        run: npm run test:frontend

      - name: Check application JavaScript syntax
        run: node --check frontend/app.js

      - name: Audit npm dependencies
        run: npm audit --audit-level=high
