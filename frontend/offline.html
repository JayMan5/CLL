<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>CourtLOG — Offline</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0b1220; color: #f8fafc; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1.5rem; box-sizing: border-box; }
    main { width: min(100%, 32rem); padding: 2rem; border: 1px solid #263247; border-radius: 1rem; background: #121b2b; }
    h1 { margin-top: 0; color: #34d399; }
    p { line-height: 1.6; color: #cbd5e1; }
    strong { color: #fbbf24; }
  </style>
</head>
<body>
  <main>
    <h1>CourtLOG is offline</h1>
    <p><strong>No custody scan has been submitted.</strong> CourtLOG does not save or queue scans while offline.</p>
    <p>Reconnect to the CourtLOG service, sign in, and scan the file again. Do not treat this page as a check-in receipt.</p>
  </main>
</body>
</html>
